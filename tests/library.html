<!doctype html><html lang="en"><meta charset="utf-8"><title>Reading Room test fixture</title><style>body{font:22px system-ui;max-width:900px;margin:60px auto;background:#f4f7fb}label{display:block;margin:24px 0}input,select,button{font:20px system-ui;padding:10px}article{background:white;padding:20px;margin-top:30px;border-radius:15px}</style><h1>Reading Room</h1><p>Find a book in the catalogue.</p><label>Search titles <input id="search" oninput="render()"></label><label>Genre <select id="genre" onchange="render()"><option>All genres</option><option>Science Fiction</option><option>History</option></select></label><label><input type="checkbox" id="available" onchange="render()"> Available only</label><article id="results" aria-live="polite"></article><script>
const books=[{title:'Orbit Atlas',genre:'Science Fiction',available:true},{title:'Orbit Lost',genre:'Science Fiction',available:false},{title:'History of Navigation',genre:'History',available:true}];function render(){const query=document.getElementById('search').value.toLowerCase(),genre=document.getElementById('genre').value,available=document.getElementById('available').checked;const found=books.filter(b=>b.title.toLowerCase().includes(query)&&(genre==='All genres'||b.genre===genre)&&(!available||b.available));document.getElementById('results').innerHTML=found.map(b=>'<h2>'+b.title+'</h2><p>'+b.genre+' · '+(b.available?'Available':'Checked out')+'</p>').join('')||'<p>No matching books</p>';}render();
</script></html>
